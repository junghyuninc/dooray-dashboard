    const worksPersonRows = Object.entries(worksPersonMap).sort((a,b)=>b[1]-a[1]).map(([n,c])=>'| '+n+' | '+c+'건 |').join('\n');

    const reportText = '## 📊 디자인팀 주간 업무 보고\n'+weekLabel+'\n\n---\n\n'
      +'### 🗂 공고제작\n'
      +'- 전체 업무: '+weekTasks.length+'건\n'
      +'- 순수 공고: '+totalGongo+'개 제작\n'
      +(totalGoImg?'- 공고이미지: '+totalGoImg+'개\n':'')
      +'- 수정: '+totalSujeong+'건\n'
      +'- 외부: '+totalOuter+'건\n'
      +(totalRpo?'- RPO합불: '+totalRpo+'건\n':'')
      +'\n| 담당자 | 업무 | 공고 | 공고이미지 | 수정 | 외부 | RPO합불 | 합계 |\n|---|---|---|---|---|---|---|---|\n'+personRows
      +'\n\n---\n\n### 🎨 배너\n'
      +'- 업무: '+bannerTasks.length+'건 · 배너 제작 '+totalBanner+'개\n\n'
      +(bannerRows?'| 담당자 | 배너 제작 |\n|---|---|\n'+bannerRows+'\n\n':'')
      +'---\n\n### ✉️ 메일링\n'
      +'- 업무: '+mailTasks.length+'건 · 이미지 '+totalImg+'개 / HTML '+totalHtml+'개\n\n'
      +(mailRows?'| 담당자 | 이미지 | HTML |\n|---|---|---|\n'+mailRows+'\n\n':'')
      +'---\n\n### 📸 스마트캠리\n'
      +'- 업무: '+smartTasks.length+'건\n\n'
      +(smartRows?'| 담당자 | 건수 |\n|---|---|\n'+smartRows+'\n\n':'')
      +'---\n\n### 📋 WORKS-고객의소리\n'
      +'- 업무: '+weekWorksT.length+'건 · 총 '+totalWorksCnt+'건 처리\n\n'
      +(worksTypeRows?'| 유형 | 건수 |\n|---|---|\n'+worksTypeRows+'\n\n':'')
      +(worksPersonRows?'| 담당자 | 처리 건수 |\n|---|---|\n'+worksPersonRows+'\n\n':'')

    const r = await fetch(
      cfg.proxy+'/proxy/project/v1/projects/'+WEEKLY_REPORT_PROJECT_ID+'/posts/'+WEEKLY_REPORT_POST_ID+'/logs',

    else alert('❌ 등록 실패: '+(data.header?.resultMessage||''));

  finally { if (btn) { btn.disabled=false; btn.textContent='📝 두레이 댓글 등록'; } }

async function fetchWeekCompare() {
  if (!cfg.token || !cfg.proxy) return;
  const { start: lastStart, end: lastEnd } = getThursdayToWednesday(-1);
  const { start: prev2Start, end: prev2End } = getThursdayToWednesday(-2);
  const { start: lyStart, end: lyEnd } = getThursdayToWednesday(-53);

  const lastStartStr  = fmtDateFull(lastStart);
  const lastEndStr    = fmtDateFull(lastEnd);
  const prev2StartStr = fmtDateFull(prev2Start);
  const prev2EndStr   = fmtDateFull(prev2End);
  const lyStartStr    = fmtDateFull(lyStart);
  const lyEndStr      = fmtDateFull(lyEnd);

  const tasks = allTasks[GONGO_PROJECT_ID] || [];

  function calcWeek(sStr, eStr, src) {
    const wt = (src||tasks).filter(t => {
      const d = t.closedAt || t.createdAt?.slice(0,10);
      return d >= sStr && d <= eStr;
    });
    const 순수 = wt.filter(t=>!t.classify?.수정&&!t.classify?.외부);
    const 수정 = wt.filter(t=>t.classify?.수정);
    const 외부 = wt.filter(t=>t.classify?.외부);
    return {
      tasks: wt.length,
      공고: wt.reduce((s,t)=>s+(t.itemCounts?.공고||0),0),
      순수공고건: 순수.length,
      순수공고수: 순수.reduce((s,t)=>s+(t.itemCounts?.공고||0),0),
      수정건: 수정.length,
      외부건: 외부.length,
    };
  }

  const lastWeek  = calcWeek(lastStartStr, lastEndStr);
  const prev2Week = calcWeek(prev2StartStr, prev2EndStr);

  let lyWeek = {tasks:0,공고:0,순수공고건:0,순수공고수:0,수정건:0,외부건:0};
  try {
    setBadge('ing','작년 데이터 조회 중...');
    let lyTasks = [];
    for (let page=0; page<5; page++) {
      const r = await fetch(
        cfg.proxy+'/proxy/project/v1/projects/'+GONGO_PROJECT_ID+'/posts?page='+page+'&size=100&order=createdAt',
        {headers:{'Authorization':'dooray-api '+cfg.token}, signal:AbortSignal.timeout(10000)}
      );
      if (!r.ok) break;
      const data = await r.json();
      const results = data.result||[];
      if (!results.length) break;
      const filtered = results.filter(p=>(p.endedAt||p.createdAt||'').slice(0,10)>=lyStartStr&&(p.endedAt||p.createdAt||'').slice(0,10)<=lyEndStr);
      lyTasks = lyTasks.concat(filtered.map(p=>parseTask(p,GONGO_PROJECT_ID)));
      const newest = (results[results.length-1].createdAt||'').slice(0,10);
      if (newest>lyEndStr) break;
      if (results.length<100) break;
      await new Promise(r=>setTimeout(r,300));
    }
    lyWeek = calcWeek(lyStartStr, lyEndStr, lyTasks);
  } catch(e) { console.warn('작년 조회 실패:', e.message); }

  weeklyCompareData = {
    lastWeek, prev2Week, lyWeek,
    lastRange:  fmtDate(lastStart)+'~'+fmtDate(lastEnd),
    prev2Range: fmtDate(prev2Start)+'~'+fmtDate(prev2End),
    lyRange:    fmtDate(lyStart)+'~'+fmtDate(lyEnd),
    updatedAt: new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
  };
  setBadge('ok','연결됨 · '+Object.values(allTasks).reduce((s,a)=>s+a.length,0)+'건');
  render();
}

  if (!weeklyCompareData) {
    return '<div style="padding:12px;background:var(--bg3);border-radius:8px;margin-bottom:16px;display:flex;align-items:center;gap:10px">'

    +'<span style="font-size:12px;font-weight:500;color:var(--text)">📊 주간 비교 보고</span>'

    +'</div>'
    +'<div style="padding:12px 14px;border-bottom:0.5px solid var(--border);background:#F8F8F5">'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:8px">📌 지난 주 실적 <span style="color:var(--text2)">'+lastRange+'</span></div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'
    +'<div style="text-align:center;padding:8px;background:#E6F1FB;border-radius:6px"><div style="font-size:10px;color:#185FA5;margin-bottom:2px">전체 업무</div><div style="font-size:18px;font-weight:600;color:#185FA5">'+lastWeek.tasks+'<span style="font-size:10px">건</span></div></div>'

  document.querySelectorAll('#lite2-tabs .proj-tab').forEach(e=>e.classList.remove('active'));

  // 디자인팀에서 2달 이전 + 진행중 업무 찾기
  const oldActive = (allTasks[DESIGN_PROJECT_ID]||[]).filter(t => {
    const isActive = t.workflowClass === 'registered' || t.workflowClass === 'working';

    return isActive && isOld;

        <div style="font-size:12px;font-weight:600;color:#92400E;margin-bottom:6px">
          2달 이전 업무 ${oldActive.length}건이 진행중 상태예요 — 집계가 되지 않습니다
        </div>
        ${oldActive.map(t => `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-size:11px;color:#92400E;background:#FDE68A;padding:1px 6px;border-radius:4px;flex-shrink:0">${t.createdAt?.slice(0,10)}</span>

            <span style="font-size:10px;color:#92400E;flex-shrink:0">→ 업무를 복사하여 재진행해주세요</span>
          </div>
        `).join('')}
      </div>
      <button onclick="document.getElementById('old-task-warning').remove()" style="font-size:16px;background:none;border:none;cursor:pointer;color:#92400E;flex-shrink:0;padding:0">✕</button>
    </div>
  `;
  document.body.appendChild(banner);
}

// ── 배너/메일 개별 기록 댓글 일괄 등록 ────────────────────────
async function recordBannerMailHistory() {
  if (!cfg.token || !cfg.proxy) { alert('API 토큰을 먼저 설정해주세요'); return; }

  const { start, end } = getThursdayToWednesday(bannerWeekOffset);
  const startStr = fmtDateFull(start);
  const endStr   = fmtDateFull(end);
  const weekLabel = fmtDate(start)+'(목) ~ '+fmtDate(end)+'(수)';
  const allT = allTasks[DESIGN_PROJECT_ID] || [];

  // 이번 주 완료된 배너 업무
  const weekBannerAll = allT.filter(t => {
    const isBanner = t.title.includes('[배너요청]') || t.title.includes('[배너요청] ')
      || t.title.includes('[배너요청(수정)]') || t.tagIds?.includes('4418269262785789521');
    return isBanner && t.closed && t.closedAt >= startStr && t.closedAt <= endStr;
  });

  // 이번 주 완료된 메일 업무
  const weekMailAll = allT.filter(t => {
    const isMail = t.title.includes('[메일링]') || t.title.includes('[공지사항/메일링]');
    const cnt = parseMailCnt(t.title);
    return isMail && cnt !== null && t.closed && t.closedAt >= startStr && t.closedAt <= endStr;
  });

  const total = weekBannerAll.length + weekMailAll.length;
  if (!total) { alert('이번 주 완료된 배너/메일 업무가 없습니다'); return; }

  if (!confirm(weekLabel+'\n배너 '+weekBannerAll.length+'건 / 메일 '+weekMailAll.length+'건에 작업 기록 댓글을 등록할까요?')) return;

  const btn = document.getElementById('btn-record-history');
  if (btn) { btn.disabled = true; btn.textContent = '등록 중...'; }

  let success = 0, fail = 0;

  // 배너 업무별 댓글 등록
  for (const t of weekBannerAll) {
    const cnt = parseBannerCnt(t.title) || 0;
    const body = '📊 **'+weekLabel+' 작업 기록**\n- 배너: **'+cnt+'개** 완료\n\n> 대시보드 자동 등록';
    try {
      const r = await fetch(
        cfg.proxy+'/proxy/project/v1/projects/'+DESIGN_PROJECT_ID+'/posts/'+t.id+'/logs',
        {method:'POST', headers:{'Authorization':'dooray-api '+cfg.token,'Content-Type':'application/json'},
         body: JSON.stringify({body:{mimeType:'text/x-markdown', content:body}})}
      );
      const data = await r.json();
      if (data.header?.isSuccessful) success++;
      else fail++;
    } catch(e) { fail++; }
    await new Promise(r => setTimeout(r, 200)); // 429 방지
  }

  // 메일 업무별 댓글 등록
  for (const t of weekMailAll) {
    const cnt = parseMailCnt(t.title);
    const body = '📊 **'+weekLabel+' 작업 기록**\n- 이미지: **'+(cnt?.img||0)+'개** / HTML: **'+(cnt?.html||0)+'개** 완료\n\n> 대시보드 자동 등록';
    try {
      const r = await fetch(
        cfg.proxy+'/proxy/project/v1/projects/'+DESIGN_PROJECT_ID+'/posts/'+t.id+'/logs',
        {method:'POST', headers:{'Authorization':'dooray-api '+cfg.token,'Content-Type':'application/json'},
         body: JSON.stringify({body:{mimeType:'text/x-markdown', content:body}})}
      );
      const data = await r.json();
      if (data.header?.isSuccessful) success++;
      else fail++;
    } catch(e) { fail++; }
    await new Promise(r => setTimeout(r, 200));
  }

  alert('✅ 완료! '+success+'건 등록'+(fail?' / '+fail+'건 실패':''));
  if (btn) { btn.disabled = false; btn.textContent = '📝 배너/메일 기록'; }
}



// ── 엑셀 복사 함수 ──────────────────────────────────────────
function copyToExcel(type) {
  const { start, end } = getThursdayToWednesday(gongoWeekOffset);
  const startStr = fmtDateFull(start);
  const endStr   = fmtDateFull(end);
  const weekLabel = fmtDate(start)+'(목) ~ '+fmtDate(end)+'(수)';
  let text = '주간\t'+weekLabel+'\n';

  if (type === 'gongo') {
    if (!lastWeeklyReportData) { alert('주간 보고 탭을 먼저 열어주세요'); return; }
    const { weekTasks, personMap } = lastWeeklyReportData;
    const sorted = Object.entries(personMap).sort((a,b)=>(b[1].공고+b[1].공고이미지+b[1].수정+b[1].외부+(b[1].RPO합불||0))-(a[1].공고+a[1].공고이미지+a[1].수정+a[1].외부+(a[1].RPO합불||0)));
    text += '담당자\t업무\t공고\t공고이미지\t수정\t외부\tRPO합불\t합계\n';
    sorted.forEach(function(item) {
      var n=item[0], d=item[1];
      var total=d.공고+d.공고이미지+d.수정+d.외부+d.배너+d.로고+(d.RPO합불||0);
      text += n+'\t'+d.tasks+'건\t'+(d.공고||0)+'\t'+(d.공고이미지||0)+'\t'+(d.수정||0)+'\t'+(d.외부||0)+'\t'+(d.RPO합불||0)+'\t'+total+'\n';
    });
    text += '합계\t'+weekTasks.length+'건\t'+sorted.reduce((s,x)=>s+x[1].공고,0)+'\t'+sorted.reduce((s,x)=>s+x[1].공고이미지,0)+'\t'+sorted.reduce((s,x)=>s+x[1].수정,0)+'\n';

  } else if (type === 'gongo-list') {
    const allT2 = allTasks[GONGO_PROJECT_ID]||[];
    const gongoT = allT2.filter(t=>{const d=t.closedAt||(t.closed?t.createdAt?.slice(0,10):null);return d&&d>=startStr&&d<=endStr;});
    text += '날짜\t업무명\t담당자\t공고수\t구분\n';
    gongoT.sort((a,b)=>(b.closedAt||b.createdAt||'')>(a.closedAt||a.createdAt||'')?-1:1).forEach(function(t) {
      var tp=t.classify?.수정?'수정':t.classify?.외부?'외부':t.tagIds?.includes(RPO_HAPBUL_TAG)?'RPO합불':'공고';
      text += (t.closedAt||t.createdAt||'').slice(5,10)+'\t'+t.title+'\t'+t.assignees.map(a=>a.name).join(', ')+'\t'+(t.itemCounts?.공고||0)+'\t'+tp+'\n';
    });

  } else if (type === 'banner') {
    const designT = allTasks[DESIGN_PROJECT_ID]||[];
    const bannerT = designT.filter(t=>{const isBanner=t.title.includes('[배너요청]')||t.title.includes('[배너요청(수정)]')||t.tagIds?.includes('4418269262785789521');const d=t.closedAt||t.updatedAt;return isBanner&&t.closed&&d>=startStr&&d<=endStr;});
    const bMap={};bannerT.forEach(t=>{const c=parseBannerCnt(t.title)||0;t.assignees.forEach(a=>{bMap[a.name]=(bMap[a.name]||0)+c;});});
    text += '담당자\t배너 제작\n';

    text += '합계\t'+Object.values(bMap).reduce((s,v)=>s+v,0)+'\n';

  } else if (type === 'banner-list') {

    const bannerT = designT.filter(t=>{const isBanner=t.title.includes('[배너요청]')||t.title.includes('[배너요청(수정)]')||t.tagIds?.includes('4418269262785789521');const d=t.closedAt||t.updatedAt;return isBanner&&t.closed&&d>=startStr&&d<=endStr;});

    const mMap={};mailT.forEach(t=>{const cnt=parseMailCnt(t.title);const isMulti=t.assignees.length>=2;t.assignees.forEach(a=>{if(!mMap[a.name])mMap[a.name]={img:0,html:0};if(isMulti&&PUB_SET.has(a.name))mMap[a.name].html+=cnt?.html||0;else if(isMulti)mMap[a.name].img+=cnt?.img||0;else{mMap[a.name].img+=cnt?.img||0;mMap[a.name].html+=cnt?.html||0;}});});
    text += '담당자\t이미지\tHTML\t합계\n';
    Object.entries(mMap).sort((a,b)=>(b[1].img+b[1].html)-(a[1].img+a[1].html)).forEach(function(item){var n=item[0],d=item[1];text+=n+'\t'+d.img+'\t'+d.html+'\t'+(d.img+d.html)+'\n';});
    text += '합계\t'+Object.values(mMap).reduce((s,d)=>s+d.img,0)+'\t'+Object.values(mMap).reduce((s,d)=>s+d.html,0)+'\t'+Object.values(mMap).reduce((s,d)=>s+d.img+d.html,0)+'\n';

  } else if (type === 'mail-list') {
    const designT = allTasks[DESIGN_PROJECT_ID]||[];
    const mailT = designT.filter(t=>{const isMail=t.title.includes('[메일링]')||t.title.includes('[공지사항/메일링]');const d=t.closedAt||t.updatedAt;return isMail&&parseMailCnt(t.title)&&t.closed&&d>=startStr&&d<=endStr;});
    text += '날짜\t업무명\t담당자\t이미지\tHTML\n';
    mailT.sort((a,b)=>(b.closedAt||b.updatedAt||'')>(a.closedAt||a.updatedAt||'')?-1:1).forEach(function(t){

      text += (t.closedAt||t.updatedAt||'').slice(5,10)+'\t'+t.title+'\t'+t.assignees.map(a=>a.name).join(', ')+'\t'+(cnt?.img||0)+'\t'+(cnt?.html||0)+'\n';
    });

  } else if (type === 'smart') {
    const designT = allTasks[DESIGN_PROJECT_ID]||[];
    const smartT = designT.filter(t=>{const isSmart=t.title.includes('[스마트캠리 요청]')||t.title.includes('[스마트캠리요청]');const d=t.closedAt||t.updatedAt;return isSmart&&t.closed&&d>=startStr&&d<=endStr;});
    const sMap={};smartT.forEach(t=>t.assignees.forEach(a=>{sMap[a.name]=(sMap[a.name]||0)+1;}));
    text += '담당자\t건수\n';
    Object.entries(sMap).sort((a,b)=>b[1]-a[1]).forEach(function(item){text+=item[0]+'\t'+item[1]+'\n';});
    text += '합계\t'+Object.values(sMap).reduce((s,v)=>s+v,0)+'\n';

  } else if (type === 'smart-list') {
    const designT = allTasks[DESIGN_PROJECT_ID]||[];
    const smartT = designT.filter(t=>{const isSmart=t.title.includes('[스마트캠리 요청]')||t.title.includes('[스마트캠리요청]');const d=t.closedAt||t.updatedAt;return isSmart&&t.closed&&d>=startStr&&d<=endStr;});
    text += '날짜\t업무명\t담당자\n';

}


// ── 배너/메일/스마트캠리 전체 엑셀 복사 ────────────────────────
function copyBannerMailAll() {
  const { start, end } = getThursdayToWednesday(bannerWeekOffset);
  const startStr  = fmtDateFull(start);
  const endStr    = fmtDateFull(end);
  const weekLabel = fmtDate(start)+'(목) ~ '+fmtDate(end)+'(수)';
  const allT = allTasks[DESIGN_PROJECT_ID] || [];

  // 배너
  const bannerT = allT.filter(t => {
    const isBanner = t.title.includes('[배너요청]') || t.title.includes('[배너요청(수정)]') || t.tagIds?.includes('4418269262785789521');
    const d = t.closedAt || t.updatedAt;
    return isBanner && t.closed && d >= startStr && d <= endStr;
  });
  // 메일
  const mailT = allT.filter(t => {
    const isMail = t.title.includes('[메일링]') || t.title.includes('[공지사항/메일링]');
    const d = t.closedAt || t.updatedAt;
    return isMail && parseMailCnt(t.title) && t.closed && d >= startStr && d <= endStr;
  });
  // 스마트캠리
  const smartT = allT.filter(t => {
    const isSmart = t.title.includes('[스마트캠리 요청]') || t.title.includes('[스마트캠리요청]');
    const d = t.closedAt || t.updatedAt;
    return isSmart && t.closed && d >= startStr && d <= endStr;
  });

  // 담당자별 집계
  const bMap={}, mMap={}, sMap={};
  bannerT.forEach(t=>{const c=parseBannerCnt(t.title)||0;t.assignees.forEach(a=>{bMap[a.name]=(bMap[a.name]||0)+c;});});
  mailT.forEach(t=>{
    const cnt=parseMailCnt(t.title)||{img:0,html:0};
    const isMulti=t.assignees.length>=2;
    t.assignees.forEach(a=>{
      if(!mMap[a.name])mMap[a.name]={img:0,html:0};
      if(isMulti&&PUB_SET.has(a.name))mMap[a.name].html+=cnt.html;
      else if(isMulti)mMap[a.name].img+=cnt.img;
      else{mMap[a.name].img+=cnt.img;mMap[a.name].html+=cnt.html;}
    });
  });
  smartT.forEach(t=>t.assignees.forEach(a=>{sMap[a.name]=(sMap[a.name]||0)+1;}));

  const totalBanner = bannerT.reduce((s,t)=>s+(parseBannerCnt(t.title)||0),0);
  const totalImg    = mailT.reduce((s,t)=>s+(parseMailCnt(t.title)?.img||0),0);
  const totalHtml   = mailT.reduce((s,t)=>s+(parseMailCnt(t.title)?.html||0),0);

  let text = '주간\t' + weekLabel + '\n\n';

  // 배너 담당자별
  text += '🎨 배너\n';
  text += '업무\t' + bannerT.length + '건\t배너 제작\t' + totalBanner + '개\n';
  text += '담당자\t배너 제작\n';
  Object.entries(bMap).sort((a,b)=>b[1]-a[1]).forEach(([n,c])=>{ text += n+'\t'+c+'개\n'; });
  text += '\n';

  // 배너 목록
  text += '날짜\t업무명\t담당자\t배너수\n';
  bannerT.sort((a,b)=>(b.closedAt||b.updatedAt||'')>(a.closedAt||a.updatedAt||'')?-1:1).forEach(t=>{
    text += (t.closedAt||t.updatedAt||'').slice(5,10)+'\t'+t.title+'\t'+t.assignees.map(a=>a.name).join(', ')+'\t'+(parseBannerCnt(t.title)||0)+'\n';
  });
  text += '\n';

  // 메일 담당자별
  text += '✉️ 메일링\n';
  text += '업무\t' + mailT.length + '건\t이미지\t' + totalImg + '개\tHTML\t' + totalHtml + '개\n';
  text += '담당자\t이미지\tHTML\t합계\n';
  Object.entries(mMap).sort((a,b)=>(b[1].img+b[1].html)-(a[1].img+a[1].html)).forEach(([n,d])=>{
    text += n+'\t'+d.img+'개\t'+d.html+'개\t'+(d.img+d.html)+'개\n';
  });
  text += '\n';

  // 메일 목록
  text += '날짜\t업무명\t담당자\t이미지\tHTML\n';
  mailT.sort((a,b)=>(b.closedAt||b.updatedAt||'')>(a.closedAt||a.updatedAt||'')?-1:1).forEach(t=>{
    const cnt=parseMailCnt(t.title)||{img:0,html:0};
    text += (t.closedAt||t.updatedAt||'').slice(5,10)+'\t'+t.title+'\t'+t.assignees.map(a=>a.name).join(', ')+'\t'+cnt.img+'\t'+cnt.html+'\n';
  });
  text += '\n';

  // 스마트캠리
  if (smartT.length) {
    text += '📸 스마트캠리\n';
    text += '업무\t' + smartT.length + '건\n';
    text += '담당자\t건수\n';
    Object.entries(sMap).sort((a,b)=>b[1]-a[1]).forEach(([n,c])=>{ text += n+'\t'+c+'건\n'; });
    text += '\n';
    text += '날짜\t업무명\t담당자\n';
    smartT.sort((a,b)=>(b.closedAt||b.updatedAt||'')>(a.closedAt||a.updatedAt||'')?-1:1).forEach(t=>{
      text += (t.closedAt||t.updatedAt||'').slice(5,10)+'\t'+t.title+'\t'+t.assignees.map(a=>a.name).join(', ')+'\n';
    });
  }

  navigator.clipboard.writeText(text).then(function(){
    alert('클립보드에 복사됐어요!\n엑셀에서 Ctrl+V로 붙여넣기 하세요.');
  }).catch(function(){
    var el=document.createElement('textarea');
    el.value=text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    alert('클립보드에 복사됐어요!\n엑셀에서 Ctrl+V로 붙여넣기 하세요.');
  });
}
